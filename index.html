<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiny Paris · North-East</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="map" aria-label="Isometric map of north-east Paris"></canvas>

    <header class="title">
      <div class="plaque">
        <span class="arrt">1<sup>er</sup> – 20<sup>e</sup> Arr<sup>t</sup></span>
        <h1>Tiny Paris</h1>
      </div>
      <div class="ticket">
        <div class="ticket-head"><span>Ticket</span><span>Paris intra-muros</span></div>
        <p id="stats">Laying the cobblestones…</p>
        <div class="stripe" aria-hidden="true"></div>
        <p class="by">
          by <a href="https://woza.ink" target="_blank" rel="noopener">woza.ink</a> ·
          <a href="https://x.com/wozacos" target="_blank" rel="noopener">X</a> ·
          <a href="https://bsky.app/profile/woza.ink" target="_blank" rel="noopener">Bluesky</a> ·
          <a href="https://github.com/Wozacosta" target="_blank" rel="noopener">GitHub</a>
        </p>
      </div>
    </header>

    <nav class="controls" aria-label="Map controls">
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-out" title="Zoom out (−)">−</button>
      <button id="theme" title="Day / night (N)">☾</button>
      <button id="pixel" title="Pixel mode (P)" aria-pressed="false">▦</button>
      <button id="painted" title="AI-painted area (A)" aria-pressed="true" hidden>✎</button>
      <button id="home" title="Whole map (H)">⌂</button>
    </nav>

    <section class="card places" id="places">
      <div class="places-body" id="places-body" hidden>
        <ul id="landmarks"></ul>
        <div class="follow">
          <span>Follow</span>
          <button data-follow="bus" title="Ride along with an RATP bus">🚌 Bus</button>
          <button data-follow="velib" title="Ride along with a Vélib'">🚲 Vélib'</button>
          <button data-follow="truck" title="Ride along with a garbage truck">🚛 Benne</button>
        </div>
      </div>
      <div class="places-bar">
        <button id="places-toggle" aria-expanded="false" aria-controls="places-body"><span class="m" aria-hidden="true">M</span>Go to <span class="chev">▴</span></button>
        <button id="wander" title="Jump to a random named building (W)">Wander ↝</button>
      </div>
    </section>

    <aside class="info" id="info" hidden>
      <button class="close" id="info-close" aria-label="Close">×</button>
      <h2 id="info-title"></h2>
      <dl id="info-body"></dl>
    </aside>

    <footer class="credit">
      Drag to pan · scroll to zoom · click a building · data ©
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors,
      <a href="https://geoservices.ign.fr/bdtopo" target="_blank" rel="noopener">IGN BD TOPO</a> · models
      <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
